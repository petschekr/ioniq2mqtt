[package]
name = "ioniq2mqtt"
version = "0.1.0"
edition = "2024"

[dependencies]
capnp = "0.27.3"
anyhow = "1.0.104"
tmq = "0.5.0"
tokio = { version = "1.54.1", features = ["full"] }
futures = "0.3.34"
rumqttc = { version = "0.25.1", default-features = false, features = ["use-native-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
reqwest = { version = "0.13.5", default-features = false, features = ["http2", "charset", "rustls", "form"] }
egm2008 = "0.1.0"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
spa = "0.5.1"
tzfile = "0.1.3"
tzf-rs = { version = "2.1.3", default-features = false, features = ["bundled"]}

[build-dependencies]
capnpc = "0.27"

[workspace.metadata.cross.target.aarch64-unknown-linux-gnu]
pre-build = [
    "dpkg --add-architecture $CROSS_DEB_ARCH",
    "apt-get update && apt-get install --assume-yes capnproto openssl pkg-config libssl-dev:$CROSS_DEB_ARCH"
]

[workspace.metadata.cross.target.aarch64-unknown-linux-gnu.env]
passthrough = [
    "PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig"
]
